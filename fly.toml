# fly.toml app configuration file generated for soberpace on 2026-05-30T10:28:41-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'soberpace'
primary_region = 'ord'

[build]

[env]
  DATABASE_PATH = "/data/database.db"

[mounts]
  source = "soberpace_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
